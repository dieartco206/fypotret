name: Daily Instagram Sync

on:
  schedule:
    # Berjalan setiap hari pukul 00:00 UTC (07:00 WIB pagi)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Tombol manual trigger di tab GitHub Actions

permissions:
  contents: write

jobs:
  sync-instagram:
    name: Sync Instagram Posts & Reels
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🎥 Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Node dependencies
        run: npm install

      - name: 📸 Run Instagram Auto-Sync Engine
        env:
          IG_COOKIES_JSON: ${{ secrets.IG_COOKIES_JSON }}
        run: node scripts/sync-instagram.js

      - name: 🧪 Verify Build Integrity
        run: npm run build

      - name: 🚀 Commit & Auto-Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Postingan/media baru terdeteksi! Melakukan commit & push..."
            git add public/portfolio/ src/data/portfolioData.ts
            git commit -m "chore(portfolio): auto-sync latest Instagram posts [skip ci]"
            git push origin main
            echo "✅ Berhasil push update ke branch main!"
          else
            echo "✨ Semua postingan Instagram sudah tersinkronisasi. Tidak ada perubahan."
          fi
